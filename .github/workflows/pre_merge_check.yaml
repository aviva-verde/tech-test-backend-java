name: Pre-merge check

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

jobs:
  build_project:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Corretto 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: corretto
          java-version: "21"
          check-latest: true
      - name: Require the Java4Shell fix before running Gradle
        run: |
          source "$JAVA_HOME/release"
          if [[ "$JAVA_VERSION" != 21.* ]] || ! dpkg --compare-versions "$JAVA_VERSION" ge 21.0.13.1; then
            echo "::error::Expected Corretto 21.0.13.1 or later on Java 21; found $JAVA_VERSION"
            exit 1
          fi
      - name: Build with Gradle
        run: ./gradlew clean build

